name: Publish npm

# Publishes the delegation-kit npm wrapper to the npm registry whenever a
# release tag (delegation-kit--v*) is pushed. The published package is the
# thin installer wrapper only: npx clones this repository at the tagged ref
# and runs ./install.sh, so the npm artifact and the git release always
# describe the same version by construction.
#
# Requires one repository secret: NPM_TOKEN (an npm automation token, so
# publishes never need a human OTP).

on:
  push:
    tags: ['delegation-kit--v*']
  # Manual re-runs publish whatever main's package.json says, so a publish
  # can be retried after a workflow fix without moving the git tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Guard — tag must match the manifest version
        # Tag pushes carry GITHUB_REF_NAME = delegation-kit--vX.Y.Z; manual
        # dispatches run on a branch where that variable is meaningless, so
        # the tag guards are skipped there and the version gates
        # (version-consistency, registry-duplicate check) still apply.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#delegation-kit--v}"
          VERSION="$(jq -r '.version' package.json)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag delegation-kit--v$TAG does not match package.json $VERSION"; exit 1
          fi

      - name: Guard — manifests and package.json agree (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        # actions/checkout maps the commit SHA onto refs/tags/<name>, leaving
        # a lightweight ref even when the pushed tag is annotated — fetch the
        # real tag object before the annotation rule can be checked (same
        # workaround as ci.yml).
        run: |
          git fetch --force --depth=1 origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          bash tests/version-consistency.sh --tag "${GITHUB_REF_NAME}"

      - name: Guard — manifests and package.json agree (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: bash tests/version-consistency.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Wrapper tests
        run: node --test tests/npm-installer.test.mjs

      - name: Guard — registry version must not already exist
        run: |
          VERSION="$(jq -r '.version' package.json)"
          if npm view "delegation-kit@$VERSION" version >/dev/null 2>&1; then
            echo "delegation-kit@$VERSION is already published"; exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
