name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['delegation-kit--v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect tracked shell files
        run: |
          git ls-files '*.sh' 'bin/*' | while read -r f; do
            head -1 "$f" | grep -q '^#!.*\(bash\|sh\)' && printf '%s\n' "$f"
          done >shfiles.txt
          echo "checking $(wc -l <shfiles.txt) files"
      # -S warning is the level the repository already meets; `style` reports
      # only informational findings and is deliberately not a gate.
      - name: shellcheck
        run: tr '\n' '\0' <shfiles.txt | xargs -0 shellcheck -S warning

  version:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the five version surfaces
        run: bash tests/version-consistency.sh
      # On a tag push, also enforce the CLAUDE.md tag convention.
      - name: Check release tag convention
        if: startsWith(github.ref, 'refs/tags/')
        run: bash tests/version-consistency.sh --tag "${GITHUB_REF_NAME}"

  tests:
    name: regression suites (macOS)
    # macOS is the platform this kit targets and the suites assume: the Kimi
    # runner requires /usr/bin/sandbox-exec and the Grok suite asserts BSD
    # `stat -f` modes. Running these on Linux would mean rewriting the kit.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A bare macOS runner has neither. The kit needs both: delegation-glm,
      # -kimi and -grok refuse to run without gtimeout/timeout, and the Kimi
      # sandbox pins a ripgrep binary. install.sh tells users to install
      # ripgrep for the same reason.
      - name: Install prerequisites
        # HOMEBREW_NO_AUTO_UPDATE keeps a future `brew update` from turning a
        # 5-second step into a minute of tap refreshing.
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install --quiet coreutils ripgrep
      - name: Verify prerequisites
        run: |
          for tool in jq python3 git shasum rg; do
            command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
          done
          command -v gtimeout >/dev/null || command -v timeout >/dev/null \
            || { echo "missing: gtimeout/timeout"; exit 1; }
          [ -x /usr/bin/sandbox-exec ] || { echo "missing: sandbox-exec"; exit 1; }
          bash --version | head -1
      - name: Routing gates and evidence snapshot
        run: |
          bin/delegation-route check
          bin/delegation-evidence check
      # Parallel on one runner: the suites are independent, and running them
      # concurrently cuts this step from ~116s to well under half without
      # allocating a second machine. run-tests.sh prints the full log of any
      # suite that fails, since parallel output is otherwise interleaved.
      - name: Regression suites
        run: ./run-tests.sh
      # A suite that mutates the checkout is a bug: they must restore whatever
      # they touch. This catches it rather than letting it leak into a release.
      - name: Suites left the checkout clean
        run: |
          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "test run dirtied the worktree:"; echo "$dirty"; exit 1
          fi
